# Forky front-end on https://forky.ca  (static files + same-origin proxy to the API)
# Files: copy the contents of dist/ to /var/www/forky.ca
server {
    listen 443 ssl http2;
    server_name forky.ca www.forky.ca;
    # ssl_certificate     /etc/letsencrypt/live/forky.ca/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/forky.ca/privkey.pem;

    root /var/www/forky.ca;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # The site calls /api/v1/... on its own address; nginx forwards it to the API (no CORS needed).
    location /api/ {
        proxy_pass https://api.forky.ca;
        proxy_set_header Host api.forky.ca;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 12m;          # document / logo uploads (10 MB limit in the app)
    }

    # Crawler files generated by the API (settings > SEO / AIO)
    location = /robots.txt            { proxy_pass https://api.forky.ca/api/v1/public/site/robots.txt;            proxy_set_header Host api.forky.ca; proxy_ssl_server_name on; }
    location = /sitemap.xml           { proxy_pass https://api.forky.ca/api/v1/public/site/sitemap.xml;           proxy_set_header Host api.forky.ca; proxy_ssl_server_name on; }
    location = /llms.txt              { proxy_pass https://api.forky.ca/api/v1/public/site/llms.txt;              proxy_set_header Host api.forky.ca; proxy_ssl_server_name on; }
    location = /llms-full.txt         { proxy_pass https://api.forky.ca/api/v1/public/site/llms-full.txt;         proxy_set_header Host api.forky.ca; proxy_ssl_server_name on; }
    location = /manifest.webmanifest  { proxy_pass https://api.forky.ca/api/v1/public/site/manifest.webmanifest;  proxy_set_header Host api.forky.ca; proxy_ssl_server_name on; }

    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-store"; }

    # Single-page app: every other URL serves index.html
    location / { try_files $uri /index.html; }
}
server { listen 80; server_name forky.ca www.forky.ca; return 301 https://forky.ca$request_uri; }
